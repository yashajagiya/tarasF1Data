name: Update F1 Data

on:
  schedule:
    # Run at 00:00 every Monday
    - cron: '0 0 * * 1'
  workflow_dispatch: # Allows manual trigger from the GitHub UI

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Required to be able to push back to the repo
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run Driver Standings Script
        run: python peerracepointdriver.py
        
      - name: Run Constructor Standings Script
        run: python peerracepointcar.py

      - name: Install race scraper dependency
        run: python -m pip install requests

      - name: Run Race Calendar Script
        run: python f1Info/code/scrape_races.py

      - name: Build Taras F1 API v2
        run: python tarasF1DataV2/build.py

      - name: Commit and Push V2 API Updates
        run: |
          git add v2/ tarasF1DataV2/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Taras F1 API v2 endpoints" && git push origin main)

